<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thiền Viện Tự Tâm - Quét Lá Đa Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { touch-action: manipulation; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; background: #1c0d07; }
    canvas { display: block; border-radius: 12px; }
    
    /* Mobile Joystick - NHỎ LẠI & GÓC TRÁI DƯỚI */
    .joystick-base { width: 90px; height: 90px; background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(253, 224, 71, 0.5); border-radius: 50%; position: absolute; bottom: 15px; left: 15px; touch-action: none; display: none; z-index: 10; }
    .joystick-thumb { width: 38px; height: 38px; background: rgba(253, 224, 71, 0.9); border-radius: 50%; position: absolute; top: 26px; left: 26px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }

    /* Chat System Style */
    #chatWidget { position: absolute; bottom: 15px; right: 15px; width: 300px; z-index: 20; transition: all 0.3s ease; }
    #chatToggle { width: 60px; height: 60px; background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(253, 224, 71, 0.6); border-radius: 50%; color: #facc15; font-size: 24px; display: flex; items-center; justify-center; cursor: pointer; float: right; }
    #chatPanel { display: none; background: rgba(0, 0, 0, 0.9); border: 2px solid #78350f; border-radius: 16px; overflow: hidden; width: 100%; height: 320px; box-shadow: 0 8px 16px rgba(0,0,0,0.7); }
    #chatHeader { background: #5a280b; padding: 10px; font-weight: bold; color: #fde047; display: flex; justify-content: space-between; border-b: 1px solid #78350f; }
    #chatMessages { padding: 10px; height: 230px; overflow-y: auto; color: #amber-100; font-size: 13px; line-height: 1.6; }
    #chatInputBar { padding: 8px; background: #2c1810; display: flex; border-t: 1px solid #78350f; }
    #chatInput { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid #78350f; border-radius: 8px; color: #fff; padding: 6px 10px; font-size: 13px; focus:outline-none; focus:border-yellow-400; }
    .chat-msg-user { color: #f97316; font-weight: bold; margin-right: 5px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 text-amber-100">

  <!-- Modal Đăng Nhập -->
  <div id="joinModal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-gradient-to-b from-amber-900 via-amber-950 to-black border-4 border-amber-600 rounded-3xl p-6 max-w-md w-full shadow-2xl text-center">
      <h1 class="text-3xl font-black text-yellow-300 mb-1 tracking-wide">🛕 Thiền Viện Tự Tâm</h1>
      <p class="text-amber-200 text-sm mb-6">Trò chơi quét lá tích phước online</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-yellow-400 mb-1">Pháp Danh:</label>
          <input type="text" id="playerName" value="Chú Tiểu Tánh Không" class="w-full bg-amber-950/80 border-2 border-amber-600 rounded-xl px-4 py-2.5 text-amber-100 focus:outline-none focus:border-yellow-400 font-semibold">
        </div>

        <button onclick="startGame()" class="w-full bg-gradient-to-r from-yellow-500 via-amber-500 to-yellow-600 hover:from-yellow-400 text-amber-950 font-black text-lg py-3 rounded-xl shadow-lg transform active:scale-95 transition">
          BƯỚC VÀO CỬA THIỀN ⛩️
        </button>
      </div>
    </div>
  </div>

  <!-- Giao Diện Màn Hình Game -->
  <div class="relative w-full max-w-5xl bg-amber-950 rounded-2xl overflow-hidden border-4 border-amber-600 shadow-2xl">
    <div class="bg-black/75 px-4 py-2.5 flex items-center justify-between text-sm font-bold border-b border-amber-700/80">
      <div class="flex items-center space-x-6">
        <span class="text-yellow-400 text-base">✨ Phước Đức: <span id="uiMerit">0</span></span>
        <span class="text-amber-200">🧹 Đã Quét: <span id="uiSweeps">0</span> lá</span>
      </div>
      <div id="blessingBanner" class="hidden animate-pulse text-yellow-300 font-extrabold bg-amber-900/90 px-4 py-1 rounded-full border border-yellow-400 text-xs shadow">
        🌟 SƯ TRỤ TRÌ BAN PHƯỚC (X2 ĐIỂM)!
      </div>
    </div>

    <canvas id="gameCanvas" width="1200" height="700" class="w-full h-auto"></canvas>
    
    <!-- Mobile Joystick (Nhỏ lại, góc trái dưới) -->
    <div id="joystickBase" class="joystick-base">
      <div id="joystickThumb" class="joystick-thumb"></div>
    </div>

    <!-- HỆ THỐNG CHAT (Bật/Tắt) -->
    <div id="chatWidget">
      <div id="chatToggle" onclick="toggleChat()">💬</div>
      <div id="chatPanel">
        <div id="chatHeader">
          <span>💬 Chat Toàn Tự</span>
          <span onclick="toggleChat()" class="cursor-pointer text-yellow-100 text-lg hover:text-red-400">✖</span>
        </div>
        <div id="chatMessages"></div>
        <div id="chatInputBar">
          <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendChatMessage()">
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Nạp ảnh nền bg.png
    const bgImage = new Image();
    bgImage.src = 'bg.png';

    let myId = null;
    let players = {};
    let myLeaves = [];
    let chatPanelVisible = false;

    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
    let joystickDir = { x: 0, y: 0 };

    function startGame() {
      const nameInput = document.getElementById('playerName');
      const name = nameInput ? nameInput.value.trim() : 'Chú Tiểu';
      
      // Ẩn modal đăng nhập ngay lập tức để tránh bị kẹt màn hình
      const modal = document.getElementById('joinModal');
      if (modal) {
        modal.classList.add('hidden');
      }

      // Gửi yêu cầu vào game lên server
      socket.emit('joinGame', { name: name });

      // Kích hoạt joystick nếu chơi trên điện thoại
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        setupJoystick();
      }
    }

    // Xử lý bật tắt Chat
    function toggleChat() {
      chatPanelVisible = !chatPanelVisible;
      document.getElementById('chatPanel').style.display = chatPanelVisible ? 'block' : 'none';
      document.getElementById('chatToggle').style.display = chatPanelVisible ? 'none' : 'flex';
    }

    // Gửi tin nhắn Chat
    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      if (input.value.trim()) {
        socket.emit('sendChatMessage', input.value);
        input.value = '';
      }
    }

    socket.on('initGameState', (data) => {
      myId = data.playerId;
      players = data.players;
      if (players[myId]) {
        myLeaves = players[myId].leaves || [];
        document.getElementById('uiMerit').innerText = players[myId].merit;
        document.getElementById('uiSweeps').innerText = players[myId].sweeps;
      }
      // Nạp tin nhắn chat cũ
      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.innerHTML = '';
      data.chatMessages.forEach(addChatMessageToUI);
    });

    socket.on('playerJoined', (p) => { players[p.id] = p; });
    socket.on('playerMoved', (data) => {
      if (players[data.id]) {
        players[data.id].x = data.x;
        players[data.id].y = data.y;
        players[data.id].facing = data.facing;
      }
    });
    socket.on('playerLeft', (id) => { delete players[id]; });

    socket.on('updatePlayerScore', (data) => {
      if (players[data.playerId]) {
        players[data.playerId].merit = data.merit;
        players[data.playerId].sweeps = data.sweeps;
        players[data.playerId].title = data.title;
        players[data.playerId].outfit = data.outfit;
        players[data.playerId].leaves = data.leaves;
        if (data.playerId === myId) {
          myLeaves = data.leaves;
          document.getElementById('uiMerit').innerText = data.merit;
          document.getElementById('uiSweeps').innerText = data.sweeps;
        }
      }
    });

    // Nhận tin nhắn Chat mới
    socket.on('newChatMessage', addChatMessageToUI);

    function addChatMessageToUI(chatMsg) {
      const messagesContainer = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'mb-2';
      msgDiv.innerHTML = `<span class="chat-msg-user">${chatMsg.name}:</span> ${chatMsg.msg}`;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight; // Tự cuộn xuống dưới cùng
    }

    window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    function update() {
      if (!myId || !players[myId] || chatPanelVisible && document.activeElement === document.getElementById('chatInput')) return;
      const me = players[myId];
      let speed = 5;
      let dx = 0, dy = 0;

      if (keys.w || keys.ArrowUp) dy -= 1;
      if (keys.s || keys.ArrowDown) dy += 1;
      if (keys.a || keys.ArrowLeft) dx -= 1;
      if (keys.d || keys.ArrowRight) dx += 1;

      if (joystickDir.x !== 0 || joystickDir.y !== 0) {
        dx = joystickDir.x;
        dy = joystickDir.y;
      }

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        // Vùng di chuyển CHỈ trong sân gạch dưới
        me.x = Math.max(160, Math.min(1040, me.x + (dx / len) * speed));
        me.y = Math.max(300, Math.min(640, me.y + (dy / len) * speed)); // Giới hạn y không lên cao

        socket.emit('playerMove', { x: me.x, y: me.y, facing: dx < 0 ? 'left' : (dx > 0 ? 'right' : me.facing) });

        myLeaves.forEach(leaf => {
          if (Math.hypot(me.x - leaf.x, me.y - leaf.y) < 40) {
            socket.emit('sweepLeaf', leaf.id);
          }
        });
      }
    }

    // RENDER LÀ Đ
