<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chú Tiểu Quét Lá Đa - Sân Chùa Lung Linh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { touch-action: manipulation; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; background: #2c1810; }
    canvas { display: block; }
    .joystick-base { width: 120px; height: 120px; background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%; position: absolute; bottom: 20px; left: 20px; touch-action: none; display: none; }
    .joystick-thumb { width: 50px; height: 50px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; position: absolute; top: 35px; left: 35px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 text-amber-100">

  <!-- Modal Đăng Nhập -->
  <div id="joinModal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-gradient-to-b from-amber-900 to-amber-950 border-4 border-amber-600 rounded-3xl p-6 max-w-md w-full shadow-2xl text-center">
      <h1 class="text-3xl font-extrabold text-yellow-300 mb-1">🛕 Thiền Viện Tự Tâm</h1>
      <p class="text-amber-200 text-sm mb-6">Trò chơi quét lá tích phước online</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-yellow-400 mb-1">Pháp Danh:</label>
          <input type="text" id="playerName" value="Chú Tiểu Tánh Không" class="w-full bg-amber-950 border-2 border-amber-600 rounded-xl px-4 py-2.5 text-amber-100 focus:outline-none focus:border-yellow-400 font-semibold">
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-yellow-400 mb-1">Chọn Vai Trò:</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" id="btnRoleMonk" onclick="selectRole('monk')" class="p-3 border-2 border-yellow-400 bg-amber-800 rounded-xl text-center font-bold text-amber-100 shadow-md">
              👶 Chú Tiểu<br><span class="text-xs font-normal text-yellow-200">Quét lá tích phước</span>
            </button>
            <button type="button" id="btnRoleAbbot" onclick="selectRole('abbot')" class="p-3 border-2 border-transparent bg-amber-950 rounded-xl text-center font-bold text-amber-300 opacity-80">
              🧙‍♂️ Sư Trụ Trì<br><span class="text-xs font-normal text-amber-300">Ban phước toàn tự</span>
            </button>
          </div>
        </div>

        <button onclick="startGame()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-amber-950 font-black text-lg py-3 rounded-xl shadow-lg transform active:scale-95 transition">
          BƯỚC VÀO CỬA THIỀN ⛩️
        </button>
      </div>
    </div>
  </div>

  <!-- Giao diện Game -->
  <div class="relative w-full max-w-5xl bg-amber-950 rounded-2xl overflow-hidden border-4 border-amber-600 shadow-2xl">
    <div class="bg-black/60 px-4 py-2.5 flex items-center justify-between text-sm font-bold border-b border-amber-700">
      <div class="flex items-center space-x-6">
        <span class="text-yellow-400 text-base">✨ Phước Đức: <span id="uiMerit">0</span></span>
        <span class="text-amber-200">🧹 Đã Quét: <span id="uiSweeps">0</span> lá</span>
      </div>
      <div id="blessingBanner" class="hidden animate-pulse text-yellow-300 font-extrabold bg-amber-900/90 px-4 py-1 rounded-full border border-yellow-400 text-xs shadow">
        🌟 SƯ TRỤ TRÌ BAN PHƯỚC (X2 ĐIỂM CÔNG ĐỨC)!
      </div>
      <div id="abbotControls" class="hidden">
        <button onclick="castBlessing()" class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 text-amber-950 font-black px-4 py-1.5 rounded-lg shadow text-xs uppercase tracking-wide">
          ✋ Ban Phước Toàn Chùa
        </button>
      </div>
    </div>

    <canvas id="gameCanvas" width="1200" height="700" class="w-full h-auto"></canvas>
    <div id="joystickBase" class="joystick-base">
      <div id="joystickThumb" class="joystick-thumb"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let selectedRole = 'monk';
    let myId = null;
    let players = {};
    let myLeaves = [];
    let blessingActive = false;

    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
    let joystickDir = { x: 0, y: 0 };

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('btnRoleMonk').className = role === 'monk' ? 'p-3 border-2 border-yellow-400 bg-amber-800 rounded-xl text-center font-bold text-amber-100 shadow-md' : 'p-3 border-2 border-transparent bg-amber-950 rounded-xl text-center font-bold text-amber-300 opacity-80';
      document.getElementById('btnRoleAbbot').className = role === 'abbot' ? 'p-3 border-2 border-yellow-400 bg-amber-800 rounded-xl text-center font-bold text-amber-100 shadow-md' : 'p-3 border-2 border-transparent bg-amber-950 rounded-xl text-center font-bold text-amber-300 opacity-80';
    }

    function startGame() {
      const name = document.getElementById('playerName').value.trim() || 'Chú Tiểu';
      document.getElementById('joinModal').classList.add('hidden');
      socket.emit('joinGame', { name: name, role: selectedRole });

      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        setupJoystick();
      }
    }

    function castBlessing() {
      socket.emit('castBlessing');
    }

    socket.on('initGameState', (data) => {
      myId = data.playerId;
      players = data.players;
      blessingActive = data.blessingActive;
      if (players[myId]) myLeaves = players[myId].leaves || [];

      if (players[myId] && players[myId].role === 'abbot') {
        document.getElementById('abbotControls').classList.remove('hidden');
      }
    });

    socket.on('playerJoined', (p) => { players[p.id] = p; });
    socket.on('playerMoved', (data) => {
      if (players[data.id]) {
        players[data.id].x = data.x;
        players[data.id].y = data.y;
        players[data.id].facing = data.facing;
      }
    });
    socket.on('playerLeft', (id) => { delete players[id]; });

    socket.on('updatePlayerScore', (data) => {
      if (players[data.playerId]) {
        players[data.playerId].merit = data.merit;
        players[data.playerId].sweeps = data.sweeps;
        players[data.playerId].leaves = data.leaves;
        if (data.playerId === myId) {
          myLeaves = data.leaves;
          document.getElementById('uiMerit').innerText = data.merit;
          document.getElementById('uiSweeps').innerText = data.sweeps;
        }
      }
    });

    socket.on('blessingStarted', () => {
      blessingActive = true;
      document.getElementById('blessingBanner').classList.remove('hidden');
    });

    socket.on('blessingEnded', () => {
      blessingActive = false;
      document.getElementById('blessingBanner').classList.add('hidden');
    });

    window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    function update() {
      if (!myId || !players[myId]) return;
      const me = players[myId];
      let speed = me.role === 'abbot' ? 3.5 : 5;
      let dx = 0, dy = 0;

      if (keys.w || keys.ArrowUp) dy -= 1;
      if (keys.s || keys.ArrowDown) dy += 1;
      if (keys.a || keys.ArrowLeft) dx -= 1;
      if (keys.d || keys.ArrowRight) dx += 1;

      if (joystickDir.x !== 0 || joystickDir.y !== 0) {
        dx = joystickDir.x;
        dy = joystickDir.y;
      }

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        const nx = me.x + (dx / len) * speed;
        const ny = me.y + (dy / len) * speed;

        me.x = Math.max(160, Math.min(1040, nx));
        me.y = Math.max(240, Math.min(640, ny));

        socket.emit('playerMove', { x: me.x, y: me.y, facing: dx < 0 ? 'left' : (dx > 0 ? 'right' : me.facing) });

        // Kiểm tra quét lá của riêng mình
        if (me.role === 'monk') {
          myLeaves.forEach(leaf => {
            const dist = Math.hypot(me.x - leaf.x, me.y - leaf.y);
            if (dist < 40) {
              socket.emit('sweepLeaf', leaf.id);
            }
          });
        }
      }
    }

    // Đồ họa sân chùa lung linh & sinh động
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Nền Trời hoàng hôn/bình minh lung linh
      let gradSky = ctx.createLinearGradient(0, 0, 0, 250);
      gradSky.addColorStop(0, '#fef08a');
      gradSky.addColorStop(1, '#f97316');
      ctx.fillStyle = gradSky;
      ctx.fillRect(0, 0, canvas.width, 250);

      // Sân Chùa Gạch Cổ Lung Linh Ánh Nắng
      ctx.fillStyle = '#78350f';
      ctx.fillRect(100, 200, 1000, 480);
      ctx.strokeStyle = '#572708';
      ctx.lineWidth = 1.5;
      for (let x = 100; x < 1100; x += 50) {
        for (let y = 200; y < 680; y += 30) {
          ctx.strokeRect(x, y, 50, 30);
        }
      }

      // Đèn lồng đỏ trang trí hai bên mái chùa
      drawLantern(320, 180);
      drawLantern(880, 180);

      // Chính Điện Cổ Kính Sắc Nét
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(320, 60, 560, 140);
      // Mái ngói cong cong
      ctx.fillStyle = '#7f1d1d';
      ctx.beginPath();
      ctx.moveTo(280, 80);
      ctx.lineTo(600, 20);
      ctx.lineTo(920, 80);
      ctx.lineTo(880, 60);
      ctx.lineTo(600, 10);
      ctx.lineTo(320, 60);
      ctx.fill();

      // Biển hiệu Chùa dát vàng
      ctx.fillStyle = '#d97706';
      ctx.fillRect(470, 90, 260, 45);
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 2;
      ctx.strokeRect(470, 90, 260, 45);
      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 18px serif';
      ctx.textAlign = 'center';
      ctx.fillText('🛕 THIỀN VIỆN TỰ TÂM', 600, 118);

      // Cây Đa Cổ Thụ To Lớn, Chăm Chút Chi Tiết Lá & Rễ
      drawAncientBanyan(180, 150);
      drawAncientBanyan(1020, 150);

      // Ao Sen Trước Sân Chùa
      ctx.fillStyle = '#0369a1';
      ctx.beginPath();
      ctx.ellipse(600, 630, 220, 45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();
      // Hoa sen hồng nổi trên mặt nước
      drawLotusFlower(520, 625);
      drawLotusFlower(680, 635);

      // Hiển thị Lá Đa của riêng người chơi này quét
      myLeaves.forEach(leaf => {
        ctx.save();
        ctx.translate(leaf.x, leaf.y);
        ctx.rotate(leaf.rotation);
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.ellipse(0, 0, 12 * leaf.scale, 6 * leaf.scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ca8a04';
        ctx.stroke();
        ctx.restore();
      });

      // Vẽ Tất Cả Người Chơi (Chú Tiểu & Sư Trụ Trì)
      Object.values(players).forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);

        if (p.role === 'abbot') {
          // Hào Quang Phật Sáng Rực Rỡ
          let gradHaoQuang = ctx.createRadialGradient(0, 0, 5, 0, 0, 50);
          gradHaoQuang.addColorStop(0, 'rgba(253, 224, 71, 0.6)');
          gradHaoQuang.addColorStop(1, 'rgba(253, 224, 71, 0)');
          ctx.fillStyle = gradHaoQuang;
          ctx.beginPath();
          ctx.arc(0, 0, 50, 0, Math.PI * 2);
          ctx.fill();

          // Thân áo Cà Sa Trụ Trì
          ctx.fillStyle = '#b45309';
          ctx.beginPath();
          ctx.arc(0, 12, 20, 0, Math.PI * 2);
          ctx.fill();

          // Đầu Chibi Sư Trụ Trì
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(0, -10, 16, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Chú Tiểu Chibi Dễ Thương
          ctx.fillStyle = '#78350f';
          ctx.beginPath();
          ctx.arc(0, 10, 15, 0, Math.PI * 2);
          ctx.fill();

          // Đầu Chibi
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(0, -10, 14, 0, Math.PI * 2);
          ctx.fill();
          
          // Má hồng dễ thương
          ctx.fillStyle = 'rgba(244, 63, 94, 0.4)';
          ctx.beginPath();
          ctx.arc(-6, -6, 3, 0, Math.PI * 2);
          ctx.arc(6, -6, 3, 0, Math.PI * 2);
          ctx.fill();

          // Nón lá sau lưng
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.arc(p.facing === 'left' ? 10 : -10, -8, 11, 0, Math.PI * 2);
          ctx.fill();

          // Chổi tre cầm tay
          ctx.strokeStyle = '#92400e';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(0, 2);
          ctx.lineTo(p.facing === 'left' ? -25 : 25, 15);
          ctx.stroke();
        }

        // Tên Pháp Danh
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(p.name, 0, -32);
        ctx.shadowBlur = 0;
        ctx.restore();
      });
    }

    // Các hàm phụ trợ vẽ chi tiết sinh động
    function drawLantern(x, y) {
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(x - 10, y, 20, 25);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(x - 4, y - 6, 8, 6);
      ctx.strokeStyle = '#7f1d1d';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 10, y, 20, 25);
    }

    function drawAncientBanyan(x, y) {
      ctx.fillStyle = '#3f1d05';
      ctx.fillRect(x - 18, y + 20, 36, 90); // Thân cây
      ctx.fillStyle = '#14532d';
      ctx.beginPath();
      ctx.arc(x, y, 65, 0, Math.PI * 2);
      ctx.arc(x - 35, y + 30, 45, 0, Math.PI * 2);
      ctx.arc(x + 35, y + 30, 45, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLotusFlower(x, y) {
      ctx.fillStyle = '#f472b6';
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function setupJoystick() {
      const base = document.getElementById('joystickBase');
      const thumb = document.getElementById('joystickThumb');
      base.style.display = 'block';

      let active = false;
      let startX, startY;

      base.addEventListener('touchstart', e => {
        active = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      });

      window.addEventListener('touchmove', e => {
        if (!active) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 35;
        const angle = Math.atan2(dy, dx);
        const moveDist = Math.min(dist, maxDist);

        thumb.style.transform = `translate(${Math.cos(angle) * moveDist}px, ${Math.sin(angle) * moveDist}px)`;
        joystickDir = { x: Math.cos(angle), y: Math.sin(angle) };
      });

      const endTouch = () => {
        active = false;
        thumb.style.transform = 'translate(0px, 0px)';
        joystickDir = { x: 0, y: 0 };
      };

      window.addEventListener('touchend', endTouch);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
